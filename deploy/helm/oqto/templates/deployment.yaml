{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "Oqto's all-in-one deployment uses local SQLite state and requires replicaCount: 1" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oqto.fullname" . }}
  labels:
    {{- include "oqto.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "oqto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oqto.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/env: {{ toJson .Values.env | sha256sum }}
        checksum/openai-compatible-providers: {{ toJson .Values.openaiCompatibleProviders | sha256sum }}
        checksum/oauth: {{ toJson .Values.oauth | sha256sum }}
        {{- if not .Values.secret.existingSecret }}
        checksum/secret: {{ toJson .Values.secret.data | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: oqto
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            - name: OPENAI_COMPATIBLE_PROVIDERS_FILE
              value: /etc/oqto/openai-compatible-providers.json
            - name: OQTO_EAVS_OAUTH_ENABLED
              value: {{ .Values.oauth.enabled | quote }}
            - name: OQTO_EAVS_OAUTH_PROVIDERS_JSON
              value: {{ toJson .Values.oauth.providers | quote }}
            - name: OQTO_EAVS_OAUTH_REDIRECT_URI
              value: {{ .Values.oauth.redirectUri | quote }}
          envFrom:
            - secretRef:
                name: {{ include "oqto.secretName" . }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: openai-compatible-providers
              mountPath: /etc/oqto/openai-compatible-providers.json
              subPath: providers.json
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "oqto.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: openai-compatible-providers
          configMap:
            name: {{ include "oqto.openaiCompatibleProvidersConfigMapName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
